name: "[4] Get Stream Title"

on:
    push:
        paths:
          - '4-GetTwitchStreamTitleSetToOBS/**'
          - 'workflows/4-getStreamTitle.yml'
    pull_request:
        paths:
          - '4-GetTwitchStreamTitleSetToOBS/**'
          - 'workflows/4-getStreamTitle.yml'

permissions:
    contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
    build:
        runs-on: ubuntu-latest
        steps:

            - uses: actions/checkout@v5
                
            - name: setup-python
              uses: actions/setup-python@v5
              with:
                python-version: '3.13'
                
            - name: Upgrade pip
              working-directory: ./4-GetTwitchStreamTitleSetToOBS
              run: python -m pip install --upgrade pip
                
            - name: Install dependencies
              working-directory: ./4-GetTwitchStreamTitleSetToOBS
              run: python -m pip install -r requirements.txt

            - name: Prepare environment variables
              working-directory: ./4-GetTwitchStreamTitleSetToOBS
              run: |
                echo '{}' | jq \
                  --arg client_id "${{ secrets.TWITCH_0_CLIENT_ID }}" \
                  --arg client_secret "${{ secrets.TWITCH_0_CLIENT_SECRET }}" \
                  --arg logins "${{ secrets.TWITCH_0_LOGINS }}" \
                  '.twitch.client_id = $client_id | .twitch.client_secret = $client_secret | .twitch.logins = $logins' > .secret

            - name: Run Python script
              working-directory: ./4-GetTwitchStreamTitleSetToOBS
              run: python getTwitchStreamTitle.py
