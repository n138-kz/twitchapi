	<script>
		window.addEventListener('DOMContentLoaded', ()=>{
			{
				const provider='twitchapi';
				let client_secret={};
				client_secret[provider]=localStorage.getItem( storage_key + `.${provider}.client_secret` );
				if(!(client_secret[provider]===null||client_secret[provider]===undefined||client_secret[provider]==='')){
					if(document.querySelectorAll(`#${provider}_request_token input[type="password"]`).length===1){
						document.querySelector(`#${provider}_request_token input[type="password"]`).value=client_secret[provider];
					}
				}
			}
			{
				const provider='twitchapi';
				let d=document.querySelector(`#${provider}_request_token>input[type="password"]`);
					d.addEventListener('keydown',ev=>{
						if(ev.key=='Enter'){
							d.closest('form').querySelector('input[type=button]').click();
						}
					}, {once:true,});
			}
			{
				let d=[];
				d.push(document.createElement('span'));
				d[d.length-1].style.position='fixed';
				d[d.length-1].style.bottom='0';
				d[d.length-1].style.left='0';
				d.push(document.createElement('a'));
				d.push(document.createElement('img'));
				d[d.length-1].src=`https://www.google.com/s2/favicons?size=64&domain=https://github.com`;
				d[d.length-2].appendChild(d[d.length-1]);
				d.pop();
				d[d.length-1].href=`https://github.com/n138-kz/twitchapi`;
				d[d.length-2].appendChild(d[d.length-1]);
				d.pop();
				d=d[d.length-1];

				if (document.querySelectorAll('footer').length>0) {
					document.querySelector('footer').appendChild(d);
				} else {
					document.body.appendChild(d);
				}
			}
			{
				let d=document.querySelector('#twitchapi_authorize>a');
				d.href='https://dev.twitch.tv/console';
				d.href='https://id.twitch.tv/oauth2/authorize';
				d.href+=`?client_id=${config['twitchapi'].client_id}`;
				d.href+=`&redirect_uri=${config['twitchapi'].redirect_uri}`;
				d.href+=`&response_type=code`;
				d.href+=`&scope=${config['twitchapi'].scope}`;
				d.href+=``;
				d.target='_self';
			}
			Array.from(document.querySelectorAll('meta[http-equiv="refresh"]')).map(e=>{
				let countdown=parseInt(`${e.content};`.split(';')[0]);
				timerId=setInterval(()=>{
					countdown--;
					if(countdown<=0) clearInterval(timerId);
					/* 
					console.debug(`countdown: ${countdown}/${parseInt(`${e.content};`.split(';')[0])} key:${timerId}`);
					 */
				}, 1000);
				sessionStorage.setItem( storage_key + '.loopCounter.refreshPage', timerId );
			});
			Array.from(document.forms).map(e=>{
				e.addEventListener('keypress', k=>{
					if (k.key === 'Enter') {
						k.preventDefault(); // Enterキーによるデフォルトのsubmit動作をキャンセル
					}
				});
			});
		});
	</script>

			static async getContents(item=undefined){

				for(let i=sessionStorage.length-1;i>=0;i--){

					if( sessionStorage.key(i).startsWith( (btoa(location.href)).slice(0, 16) + `.@.api.` ) ){

				await twitchapi.printInfo(item_wrapper, 'twitch_user');

					let markers=await twitchapi.getItem(item_wrapper, 'VideoMarkers', api.videos.twitchapi[i].id);
					markers=markers.markers||markers;
					api.videos.twitchapi[i].markers=markers;
					sessionStorage.setItem( storage_key + `.@.api.videos.${this.API_PROVIDER}[${i}].markers`, JSON.stringify(markers) );

										e.duration_seconds=e.duration.split(/[hms]/).filter(Boolean).map((s, i) => i === 0 ? s : s.padStart(2, '0')).join(':').split(':').reduce((acc, time) => (acc * 60) + +time, 0);
	
										publish_at.setSeconds(publish_at.getSeconds()+e.duration_seconds);
										e.end_published_at=publish_at;
									}
	
									structure.push(document.createElement('td'));
									structure[structure.length-1].dataset.videoId=e.id;
									structure[structure.length-1].dataset.itemName='published_at';
									structure.push(document.createElement('div'));
									structure[structure.length-1].innerText=`${new Date(e.published_at).toLocaleString()}`;
									structure[structure.length-2].appendChild(structure[structure.length-1]); /* td > div */
									structure.pop();
	
									structure.push(document.createElement('div'));
									structure[structure.length-1].innerText=`${formatRelativeTime(new Date(e.end_published_at))}`;
									structure[structure.length-2].appendChild(structure[structure.length-1]); /* td > div */
									structure.pop();
									structure[structure.length-2].appendChild(structure[structure.length-1]); /* tr > td */
									structure.pop();
								}

								{
									structure.push(document.createElement('td'));
									structure[structure.length-1].dataset.videoId=e.id;
									structure[structure.length-1].dataset.itemName='duration';
									structure.push(document.createElement('div'));
									structure[structure.length-1].dataset.durationSeconds=structure[structure.length-1].innerText.split(':').reduce((acc, time) => (acc * 60) + +time, 0);
									structure[structure.length-1].innerText=e.duration.replace(/(d|h|m)/gi, ':').replace('s', '').split(':').map(s => s.padStart(2, '0')).join(':');
									structure[structure.length-1].innerText=e.duration.split(/[hms]/).filter(Boolean).map((s, i) => i === 0 ? s : s.padStart(2, '0')).join(':');
									structure[structure.length-1].innerText+=`\n(${e.end_published_at.toLocaleString()})`;
									structure[structure.length-2].appendChild(structure[structure.length-1]); /* td > div */
									structure.pop();
									structure[structure.length-2].appendChild(structure[structure.length-1]); /* tr > td */
									structure.pop();
								}

								{
									structure.push(document.createElement('td'));
									structure[structure.length-1].dataset.videoId=e.id;
									structure[structure.length-1].dataset.itemName='markers';
									structure.push(document.createElement('ul'));
									structure.push(document.createElement('li'));
									structure.push(document.createElement('a'));
									structure[structure.length-1].href=`${e.url}?t=00h00m00s`;
									structure[structure.length-1].target='_blank';
									structure.push(document.createElement('img'));
									structure[structure.length-1].src='https://www.benricho.org/loading_images/img-transparent/482-48.gif';
									structure[structure.length-1].alt='Loading...';
									structure[structure.length-2].appendChild(structure[structure.length-1]); /* a > img */
									structure.pop();
									structure.push(document.createElement('span'));
									structure[structure.length-1].innerText='Loading markers...';
									structure[structure.length-2].appendChild(structure[structure.length-1]); /* a > span */
									structure.pop();
									structure[structure.length-2].appendChild(structure[structure.length-1]); /* li > a */
									structure.pop();
									structure[structure.length-2].appendChild(structure[structure.length-1]); /* ul > li */
									structure.pop();
									structure[structure.length-2].appendChild(structure[structure.length-1]); /* td > ul */
									structure.pop();
	
									structure[structure.length-2].appendChild(structure[structure.length-1]); /* tr > td */
									structure.pop();
	
									structure[structure.length-2].appendChild(structure[structure.length-1]); /* tbody > tr */
									structure.pop();
	
									{
										Array.from(document.querySelectorAll('#errortext')).map(e=>e.remove());
										let b=document.createElement('span');
										b.innerText=`Loading videos(${api.videos.twitchapi.length})... ${Math.round((i/api.videos.twitchapi.length)*100)}%`;
										b.style.color='#0a0';
										b.id='errortext';
										if (item!==undefined) {
											item.parentNode.appendChild(b);
										}
									}
								}
							}
						};
						structure[structure.length-2].appendChild(structure[structure.length-1]); /* table > tbody */
						structure.pop();
						structure[structure.length-2].appendChild(structure[structure.length-1]); /* div > table */
						structure.pop();
						Array.from(document.querySelectorAll('#errortext')).map(e=>e.remove());

						break;
					case 'twitch_videos_markers':
						{
							Array.from(document.querySelectorAll('#errortext')).map(e=>e.remove());
							let b=document.createElement('span');
							b.innerText=`Loading videos(${api.videos.twitchapi.length})... 0%`;
							b.style.color='#0a0';
							b.id='errortext';
							if (item!==undefined) {
								item.parentNode.appendChild(b);
							}
						}
						for (let i=0;i<api.videos.twitchapi.length; i++) {
							const e=api.videos.twitchapi[i];
							structure=[];
							{
								Array.from(document.querySelectorAll('#errortext')).map(e=>e.remove());
								let b=document.createElement('span');
								b.innerText=`Loading videos(${api.videos.twitchapi.length})... ${Math.round((i/api.videos.twitchapi.length)*100)}%`;
								b.style.color='#0a0';
								b.id='errortext';
								if (item!==undefined) {
									item.parentNode.appendChild(b);
								}
							}
							const marker_element=document.querySelector(`[data-video-id="${e.id}"][data-item-name="markers"]>ul`);
							if (marker_element!==null) {
								marker_element.innerText='';
								if (e.markers.length>0) {
									e.markers.unshift({
										id: 'start',
										created_at: e.created_at,
										description: 'Start',
										position_seconds: 0,
									});
									e.markers.forEach(m=>{
										try{
											m.position_format={};
											m.position_format['hours']=Math.floor(`${m.position_seconds/3600}`);
											m.position_format['minutes']=`00${Math.floor((m.position_seconds%3600)/60)}`.substr(-2);
											m.position_format['seconds']=`00${(m.position_seconds%3600)%60}`.substr(-2);
											m.position_format['format1']=`${m.position_format['hours']}:${m.position_format['minutes']}:${m.position_format['seconds']}`;
											m.position_format['format2']=`${m.position_format['hours']}h${m.position_format['minutes']}m${m.position_format['seconds']}s`;
											if (
												false
												|| m.description == ''
												|| m.description == 'auto-marker'
												|| m.description == `Created by BarRaider's Twitch Tools`
											) {
												m.description=`${m.position_format['format2']}`;
											}

											structure.push(document.createElement('li'));
											structure.push(document.createElement('a'));
											structure[structure.length-1].innerText=`- ${m.position_format['format1']} ${m.description}`;
											structure[structure.length-1].dataset.id=m.id;
											structure[structure.length-1].dataset.created_at=m.created_at;
											structure[structure.length-1].dataset.description=m.description;
											structure[structure.length-1].dataset.position_seconds=m.position_seconds;
											structure[structure.length-1].href=`${e.url}?t=${m.position_format['format2']}`;
											structure[structure.length-1].target='_blank';
											structure[structure.length-2].appendChild(structure[structure.length-1]); /* li > a */
											structure.pop();
											marker_element.appendChild(structure[structure.length-1]);
											structure.pop();
										} catch (error) {
											console.error(error);
										}
									});
									structure.push(document.createElement('textarea'));
									structure[structure.length-1].value=marker_element.innerText;
									structure[structure.length-1].setAttribute('readonly', 'readonly');
									structure[structure.length-1].setAttribute('onclick', `this.select();navigator.clipboard.writeText(this.value).then().catch(err=>{console.error('Failed to copy to clipboard:', err);});`);
									marker_element.parentNode.appendChild(structure[structure.length-1]);
									structure.pop();
								}
							}
						}
						Array.from(document.querySelectorAll('#errortext')).map(e=>e.remove());

						break;
					default:
						break;
				}
				if(document.getElementById(itemName)!==null){
					document.getElementById(itemName).innerHTML='';
					document.getElementById(itemName).appendChild(structure[0]);
				}
				console.debug(document.getElementById(itemName), structure);
			}
			static async storeStreamStatus() {
				const funcLanchAt=Math.floor(Date.now()/10**3);
				api.user[twitchapi.API_PROVIDER]=await twitchapi.getItem(undefined, 'UserInfo');
				await twitchapi.getItem(undefined, 'StreamStatus');
				return api.user[twitchapi.API_PROVIDER];
			}
			static downloadJSON(data={}, filename=undefined) {
				const funcLanchAt=Math.floor(Date.now()/10**3);
				/*
				@description:
					Download data as JSON file. If filename is not provided, it will be generated based on the current location and timestamp.
					データをJSONファイルとしてダウンロードします。ファイル名が指定されていない場合は、現在地とタイムスタンプに基づいて自動的に生成されます。
				@args:
					data: The data to be downloaded as JSON.
					filename: The name of the file to be downloaded. If undefined, it will be generated as `debug-{origin}-{pathname}-{timestamp}.json`.
				@example:
					twitchapi.downloadJSON(api, undefined);
				*/
				if (typeof filename === 'undefined') {
					filename = `debug-${location.origin.replace(/\//g, '-')}-${location.pathname.replace(/\//g, '-')}-${Math.trunc(Date.now()/10**3)}.json`;
				}
				const blob = new Blob([JSON.stringify(data, null, 4)], {type: 'application/json'});
				const a = document.createElement('a');
				a.href = URL.createObjectURL(blob);
				a.download = filename;
				document.body.appendChild(a);
				a.click();
				document.body.removeChild(a);
				URL.revokeObjectURL(a.href);
				console.debug(`Downloaded ${filename}`, data);
			}
			static async setVideoMarker(description=''){
				const funcLanchAt=Math.floor(Date.now()/10**3);
				description=(description.length==0)?'auto-marker':description;

				try {
					let xhr=await fetch('https://api.twitch.tv/helix/streams/markers', {
						method: 'POST',
						headers: {
							'Content-Type': 'application/json',
							'Client-Id': `${config['twitchapi'].client_id}`,
							Authorization: `Bearer ${api.token[this.API_PROVIDER].access_token}`,
						},
						body: JSON.stringify({
							user_id: api.user[this.API_PROVIDER].id,
							description: `${description}`
						}),
					});
					let result=await xhr.json();
					console.debug('xhr result', result, await xhr.ok);
					if (!await xhr.ok) {
						throw new Error(`${xhr.status}: ${result.message}`);
					}
					return result;
				} catch (error) {
					console.error(error);
					return error;
				}
			}
			static async autosetVideoMarker(){
				const funcLanchAt=Math.floor(Date.now()/10**3);
				setInterval(()=>{
					let now = new Date();
					if (now.getMinutes()==0 && now.getSeconds()==0) {
						twitchapi.setVideoMarker();
					}
				},500);
			}
		} /* End of Class twitchapi */
	</script>
</head>
<body>
	<div id="twitchapi_authorize">
		<a href="" tabindex="1">twitch authorize</a>
	</div>
	<div>
		<table>
			<tr>
				<td>
					<form id="twitchapi_request_token" class="require_code">
						<input type="button" value="トークン取得" tabindex="12" onclick="twitchapi.getToken(this, [twitchapi.storeStreamStatus]);">
						<input type="password" value="secret-key" tabindex="11" placeholder="Input the client_secret" onclick="this.select();">
					</form>
				</td>
			</tr>
			<tr>
				<td>
					<form id="twitchapi_getContents" class="require_authn">
						<input type="button" value="動画一覧取得" tabindex="21" onclick="twitchapi.getContents(this);setInterval(() => { twitchapi.getContents(this); }, 60*1000);">
					</form>
				</td>
			</tr>
			<tr>
				<td>
					<form id="twitchapi_autosetVideoMarker" class="require_authn require_streamingstatus">
						<input type="button" value="マーカー自動登録ON" tabindex="31" onclick="twitchapi.autosetVideoMarker(this);this.remove();">
					</form>
				</td>
			</tr>
			<tr>
				<td>
					<form id="twitchapi_setVideoMarker" class="require_authn require_streamingstatus">
						<input type="button" value="マーカー登録" tabindex="42" onclick="twitchapi.setVideoMarker(this);">
						<input type="text" value="" tabindex="41" placeholder="ここ！ここだよ！ここ！" onkeypress="if(event.key==='Enter'){twitchapi.setVideoMarker(this.value);this.value='';setTimeout(() => { twitchapi.getContents(this); }, 3000);}">
					</form>
				</td>
			</tr>
		</table>
	</div>
	<div id="twitch_user"></div>
	<div id="twitch_videos"></div>
</body>
</html>
