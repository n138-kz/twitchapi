			function formatRelativeTime(date) {
				const now = new Date();
				const diffInSeconds = Math.floor((date - now) / 1000);

				// 時間の単位と秒数の定義
				const units = [
					{ label: 'year',   seconds: 31536000 },
					{ label: 'month',  seconds: 2592000 },
					{ label: 'day',    seconds: 86400 },
					{ label: 'hour',   seconds: 3600 },
					{ label: 'minute', seconds: 60 },
					{ label: 'second', seconds: 1 }
				];

				// 日本語設定で初期化
				const rtf = new Intl.RelativeTimeFormat('ja', { numeric: 'always' });

				for (const unit of units) {
					if (Math.abs(diffInSeconds) >= unit.seconds || unit.label === 'second') {
						const value = Math.floor(diffInSeconds / unit.seconds);
						return rtf.format(value, unit.label);
					}
				}
			}
			async function twitchapi_getToken(item, callback=[]){

					code: twitchapi.code,
					grant_type: 'authorization_code',

				};

				{
					item.children.item(0).style.borderColor='#000000';
					item.children.item(0).style.backgroundColor='#ffffff';
					item.children.item(0).style.color='#000000';
					Array.from(document.querySelectorAll('#errortext')).map(e=>e.remove());
				}

				try {
					let xhr=await fetch('https://id.twitch.tv/oauth2/token', {
						method: 'POST',
						headers: {'content-type': 'application/x-www-form-urlencoded'},
						body: new URLSearchParams(d),

					let r=await xhr.json();
					console.debug('xhr result', r, await xhr.ok);

						throw new Error(`${xhr.status}: ${r.message}`);
					}

					{
						let b=document.createElement('span');
						b.innerText=`${xhr.status}: token has issued`;
						b.style.color='#00aa00';
						b.id='errortext';
						item.appendChild(b);
	
						item.children.item(0).style.borderColor='#00ff00';
						item.children.item(0).style.backgroundColor='#00aa00';
						item.children.item(0).style.color='#ffffff';
					}
					twitchapi.token=r;
					twitchapi.token.issued_at=Date.now()/10**3;
					twitchapi.token.expires_in=(twitchapi.token.expires_in>0)?twitchapi.token.expires_in:0;
					twitchapi.token.expires_at=twitchapi.token.issued_at+twitchapi.token.expires_in;

						sessionStorage.setItem( (btoa(location.href)).slice(0, 16) + '.twitch.updateToken.loopCounter',
							setInterval(()=>{
								twitchapi_updateToken();
							}, 10**3*300)

						console.debug(`twitchapi_updateToken_loopCounter: ${sessionStorage.getItem( (btoa(location.href)).slice(0, 16) + '.loopCounter.twitch.updateToken' )}`);
						
						Array.from(document.querySelectorAll('meta[http-equiv="refresh"]')).map(e=>{
							console.debug(`meta[http-equiv="refresh"]:`, e);
							e.content='';
							e.remove();
							window.stop();
						});
					} catch (error) { console.error(error); }
				} catch (error) {
					console.error(error);

					let b=document.createElement('span');
					b.innerText=error;
					b.style.color='#ff0000';
					b.id='errortext';
					item.appendChild(b);

					item.children.item(0).style.borderColor='#ff0000';
					item.children.item(0).style.backgroundColor='#aa0000';
					item.children.item(0).style.color='#ffffff';
				}
				if(Array.isArray(callback)){
					Array.from(callback).map(async (c)=>await c());
				}
			}

			async function waitForId(obj, prop, interval = 100) {
				return new Promise(resolve => {
					if (obj[prop]) return resolve(obj[prop]);
					
					const timer = setInterval(() => {
						if (obj[prop]) {
							clearInterval(timer);
							resolve(obj[prop]);
						}
					}, interval);
				});
			}

					let xhr=await fetch('https://api.twitch.tv/helix/streams/markers', {
						method: 'POST',
						headers: {
							'Content-Type': 'application/json',
							'Client-Id': `${config.twitch.client_id}`,
							Authorization: `Bearer ${twitchapi.token.access_token}`,
						},
						body: JSON.stringify({user_id: twitchapi.user.id, description: `${description}`})
					});
					let r=await xhr.json();
					console.debug('xhr result', r, await xhr.ok);
					if (!await xhr.ok) {
						throw new Error(`${xhr.status}: ${r.message}`);
					}
					result=r;
				} catch (error) {
					console.error(error);
					let b=document.createElement('span');
					b.innerText=error;
					b.style.color='#ff0000';
					b.id='errortext';
					item.appendChild(b);

					if (item!==undefined) {
						item.children.item(0).style.borderColor='#ff0000';
						item.children.item(0).style.backgroundColor='#aa0000';
						item.children.item(0).style.color='#ffffff';
					}
					return false;
				}

				return result;
				//-------------------------------------------------------------------------
				/* ↑ CORSで動かなかったときは ↓ でサーバ経由させる。配信中のみ確認できる。動作未確認。

						item:undefined,
						client_id:undefined,
						code:undefined,
						id: undefined,
					};
					request_params.item='set-markers';
					request_params.client_id=config.twitch.client_id;
					request_params.code=twitchapi.token.access_token;
					request_params.id=id;
					request_params=JSON.stringify(request_params);

					let api={
						url: undefined,
						method: 'GET',
						headers: {

						}

					api.url=`./contents/?item=${request_params}`;
					console.debug(`api.url: ${api.url}`);

					try {

							mode: 'no-cors',

						console.debug('xhr result', r, await xhr.ok);
						if (!await xhr.ok) {
							throw new Error(`${xhr.status}: ${r.message}`);
						}
						result=r;
					} catch (error) {
						console.error(error);
						let b=document.createElement('span');
						b.innerText=error;
						b.style.color='#ff0000';

						item.appendChild(b);

						if (item!==undefined) {

			}

			function twitchapi_autosetVideoMarker(item=undefined) {
				setInterval(()=>{
					let now = new Date();
					console.debug(`twitchapi_autosetVideoMarker: Run?`, (now.getMinutes()==0 && now.getSeconds()==0));
					if (now.getMinutes()==0 && now.getSeconds()==0) {
						twitchapi_autosetVideoMarker(document.getElementById('twitchapi_setVideoMarker').children.item(0));
						while(now.getMinutes()==0 && now.getSeconds()==0) { now = new Date(); }
					}
				},500);
			}

			async function twitchapi_getContents(item){
				item=item.parentNode;

				item.children.item(0).style.borderColor='#000000';
				item.children.item(0).style.backgroundColor='#ffffff';
				item.children.item(0).style.color='#000000';
				Array.from(document.querySelectorAll('#errortext')).map(e=>e.remove());

				twitchapi.user=await twitchapi_getUserInfo(item);
				twitchapi.user.streamStatus=await twitchapi_getStreamStatus(twitchapi.user.id, item);
				twitchapi.user.isStreaming=twitchapi.user.streamStatus.type==='live';
				twitchapi.videos=await twitchapi_getVideos(twitchapi.user.id, item);

				if (item!==undefined) {
					item.children.item(0).style.borderColor='#000000';
					item.children.item(0).style.backgroundColor='#ffffff';
					item.children.item(0).style.color='#000000';
					Array.from(document.querySelectorAll('#errortext')).map(e=>e.remove());
				}

				twitchapi_itemshown('user', true);

				if (item!==undefined) {
					let b=document.createElement('span');
					b.innerText=`videos ${twitchapi.videos.length} loading`;
					b.style.color='#00aa00';
					b.id='errortext';
					item.appendChild(b);

					item.children.item(0).style.borderColor='#00ff00';
					item.children.item(0).style.backgroundColor='#00aa00';
					item.children.item(0).style.color='#ffffff';
				}

				for(let i=0;i<twitchapi.videos.length;i++){
					twitch_video_markers=await twitchapi_getVideoMarker(twitchapi.videos[i].id);
					twitch_video_markers=twitch_video_markers.markers;
					console.debug('twitch_video_markers', twitch_video_markers);
					console.debug('twitch_video_markers', 'Array.isArray', Array.isArray(twitch_video_markers));
					try {
						if (!Array.isArray(twitch_video_markers)) {
							twitch_video_markers=[];
						}
						twitch_video_markers.unshift({
							URL: `https://twitch.tv/yuukomiya/manager/highlighter/${twitchapi.videos[i].id}?t=0`,
							created_at: `${twitchapi.videos[i].created_at}`,
							description: `Created by ${location.host}`,
							id: null,
							position_seconds: 0,
						});
					} catch (error) {
						Array.from(document.querySelectorAll('#errortext')).map(e=>e.remove());
						console.error(error);
						
						let b=document.createElement('span');
						b.innerText=error;
						b.style.color='#ff0000';
						b.id='errortext';
						item.appendChild(b);

						item.children.item(0).style.borderColor='#ff0000';
						item.children.item(0).style.backgroundColor='#aa0000';
						item.children.item(0).style.color='#ffffff';
					}
					twitchapi.videos[i].markers=twitch_video_markers;
					document.getElementById('errortext').innerText=`videos ${twitchapi.videos.length} loading... ${Math.trunc((i+1)/twitchapi.videos.length*100)}%`
					console.debug(`progress: ${Math.trunc((i+1)/twitchapi.videos.length*100)}%`);
				}
				console.debug(twitchapi);

				if (item!==undefined) {
					Array.from(document.querySelectorAll('#errortext')).map(e=>e.remove());

					let b=document.createElement('span');
					b.innerText=`videos ${twitchapi.videos.length} loaded`;
					b.style.color='#00aa00';
					b.id='errortext';
					item.appendChild(b);

					item.children.item(0).style.borderColor='#00ff00';
					item.children.item(0).style.backgroundColor='#00aa00';
					item.children.item(0).style.color='#ffffff';
				}

				twitchapi_itemshown('videos');
				return false;
			}

			async function twitchapi_itemshown(object='',cleanup=false){
				const export_to=document.getElementById('twitch_videos');
				if (cleanup===true) {
					Array.from(document.getElementById('twitch_videos').children).map(e=>e.remove());
				}
				Array.from(document.querySelectorAll('#errortext')).map(e=>e.remove());

				let item=[];
				switch (object) {
					case 'user':
						item[0]=document.createElement('div');
						item[1]=document.createElement('a');
						item[1].href=`https://www.twitch.tv/${twitchapi.user.login}`;
						item[2]=document.createElement('img');
						item[2].src=twitchapi.user.profile_image_url;
						item[2].alt=`https://www.twitch.tv/${twitchapi.user.login}`;
						item[2].style.maxWidth='3em';
						item[1].appendChild(item[2]);
						item[0].appendChild(item[1]);
						item[1]=document.createElement('span');
						item[1].innerText=(twitchapi.user.isStreaming)?'<LIVE>':null;
						item[0].appendChild(item[1]);
						export_to.appendChild(item[0]);

						if(twitchapi.user.isStreaming===true){
							Array.from(document.querySelectorAll('.require_streamingstatus')).map(e=>e.classList.remove('require_streamingstatus'));
						}
						break;
					case 'videos':
						item[0]=document.createElement('div');
						item[1]=document.createElement('table');
						item[1].style.borderStyle='dotted';
						item[1].style.borderColor='#000';
						item[1].style.borderWidth='1px';
						item[1].style.fontSize='9pt';
						item[2]=document.createElement('tr');
						[
							'#',
							'タイトル',
							'公開日',
							'言語',
							'Duration',
							'Markers',
						].map(e=>{
							item[3]=document.createElement('th');
							item[3].style.borderStyle='solid';
							item[3].style.borderColor='#000';
							item[3].style.borderWidth='1px';
							item[3].innerText=e;
							item[3].style.textAlign='center';
							item[2].appendChild(item[3]);
						});
						item[1].appendChild(item[2]);

						for(let i=0;i<twitchapi.videos.length;i++){
							item[2]=document.createElement('tr');
							item[3]=document.createElement('th');
							item[3].style.borderStyle='solid';
							item[3].style.borderColor='#000';
							item[3].style.borderWidth='1px';
							item[3].innerText=i;
							item[3].style.textAlign='right';
							item[2].appendChild(item[3]);

							item[3]=document.createElement('td');
							item[3].style.borderStyle='solid';
							item[3].style.borderColor='#000';
							item[3].style.borderWidth='1px';
							item[4]=document.createElement('a');
							item[4].href=twitchapi.videos[i].url;
							item[4].dataset.metaCreated_at=twitchapi.videos[i].created_at;
							item[4].dataset.metaDescription=twitchapi.videos[i].description;
							item[4].dataset.metaDuration=twitchapi.videos[i].duration;
							item[4].dataset.metaId=twitchapi.videos[i].id;
							item[4].dataset.metaLanguage=twitchapi.videos[i].language;
							item[4].dataset.metaPublished_at=twitchapi.videos[i].published_at;
							item[4].dataset.metaStream_id=twitchapi.videos[i].stream_id;
							item[4].dataset.metaThumbnail_url=twitchapi.videos[i].thumbnail_url;
							item[4].dataset.metaTitle=twitchapi.videos[i].title;
							item[4].dataset.metaType=twitchapi.videos[i].type;
							item[4].dataset.metaUrl=twitchapi.videos[i].url;
							item[4].dataset.metaUser_id=twitchapi.videos[i].user_id;
							item[4].dataset.metaUser_login=twitchapi.videos[i].user_login;
							item[4].dataset.metaUser_name=twitchapi.videos[i].user_name;
							item[4].dataset.metaView_count=twitchapi.videos[i].view_count;
							item[4].dataset.metaViewable=twitchapi.videos[i].viewable;
							item[5]=document.createElement('span');
							item[5].innerText=twitchapi.videos[i].title;
							item[4].appendChild(item[5]);
							item[5]=document.createElement('br');
							item[4].appendChild(item[5]);
							item[5]=document.createElement('img');
							item[5].style.width=`${854/4}px`;
							item[5].style.height=`${480/4}px`;
							item[5].src=twitchapi.videos[i].thumbnail_url.replace('%{width}', '854').replace('%{height}', '480');
							if(i===0&&twitchapi.user.isStreaming){
								item[5].src=twitchapi.user.streamStatus.thumbnail_url.replace('{width}', '854').replace('{height}', '480');
							}else{
								item[5].setAttribute('onerror', 'console.warn(`Traped img.onerror. URL:${this.src}`);this.remove();');
							}
							item[4].appendChild(item[5]);
							item[3].appendChild(item[4]);
							item[3].style.textAlign='left';
							item[2].appendChild(item[3]);

							item[3]=document.createElement('td');
							item[3].style.borderStyle='solid';
							item[3].style.borderColor='#000';
							item[3].style.borderWidth='1px';
							item[4]=document.createElement('div');
							item[4].style.whiteSpace='nowrap';
							item[4].innerText=`${new Date(twitchapi.videos[i].published_at).toLocaleDateString()} ${new Date(twitchapi.videos[i].published_at).toLocaleTimeString()}`;
							item[3].appendChild(item[4]);
							if (false) {
							} else if (twitchapi.videos[i].type=='archive') {
								item[4]=document.createElement('div');
								item[4].style.whiteSpace='nowrap';
								item[4].innerText=`${formatRelativeTime(new Date(twitchapi.videos[i].published_at))}`;
								item[3].appendChild(item[4]);
							} else if (twitchapi.videos[i].type=='highlight') {
							} else {
								item[4]=document.createElement('div');
								item[4].style.whiteSpace='nowrap';
								item[4].innerText=`${formatRelativeTime(new Date(twitchapi.videos[i].published_at))}`;
								item[3].appendChild(item[4]);
							}
							item[3].style.textAlign='left';
							item[2].appendChild(item[3]);

							item[3]=document.createElement('td');
							item[3].style.borderStyle='solid';
							item[3].style.borderColor='#000';
							item[3].style.borderWidth='1px';
							item[4]=document.createElement('img');
							item[4].alt=twitchapi.videos[i].language;
							item[4].src=`./logo/${twitchapi.videos[i].language}.svg`;
							item[3].appendChild(item[4]);
							item[3].style.textAlign='left';
							item[2].appendChild(item[3]);

							item[3]=document.createElement('td');
							item[3].style.borderStyle='solid';
							item[3].style.borderColor='#000';
							item[3].style.borderWidth='1px';
							item[3].innerText=twitchapi.videos[i].duration.replace(/(d|h|m)/gi, ':').replace('s', '').split(':').map(s => s.padStart(2, '0')).join(':');
							item[3].style.textAlign='right';
							item[2].appendChild(item[3]);

							item[3]=document.createElement('td');
							item[3].style.borderStyle='solid';
							item[3].style.borderColor='#000';
							item[3].style.borderWidth='1px';
							if (twitchapi.videos[i].markers===undefined) {
								item[3].innerText='';
							} else {
								item[4]=document.createElement('div');
								twitchapi.videos[i].markers.map(e=>{
									item[5]=document.createElement('p');
									item[5].style.whiteSpace='nowrap';
									item[6]=document.createElement('span');
									item[6].innerText='- ';
									item[5].appendChild(item[6]);
									item[6]=document.createElement('a');
									item[6].href=e.URL;
									item[6].dataset.created_at=e.created_at;
									e.description=(e.description.length>0)?e.description:'Created by Twitch console';
									item[6].dataset.description=e.description;
									item[6].dataset.id=e.id;
									item[6].dataset.video=twitchapi.videos[i].url;
									t={p:e.position_seconds};
									t.h=parseInt(t.p/3600);
									t.m=parseInt((t.p%3600)/60);
									t.s=((t.p%3600)%60);
									t.f=`${t.h}:${t.m}:${t.s}`.split(':').map(s => s.padStart(2, '0')).join(':');
									item[6].dataset.position_seconds=e.position_seconds;
									item[6].dataset.position_seconds_query=`${t.h}h${t.m}m${t.s}s`;
									item[6].href=`${twitchapi.videos[i].url}?t=${t.h}h${t.m}m${t.s}s`;
									item[6].innerText=`${t.f} ${e.description}`;
									item[5].appendChild(item[6]);
									item[4].appendChild(item[5]);
								});
								item[3].appendChild(item[4]);
							}
							item[3].style.textAlign='left';
							item[2].appendChild(item[3]);

							item[1].appendChild(item[2]);
						}
						item[0].appendChild(item[1]);
						export_to.appendChild(item[0]);
						break;
					default:
				}
			}

		</script>
	</div>
	<div>
		<table>
			<tr>
				<td>
					<form id="twitchapi_request_token" class="require_code">
						<input type="button" value="トークン取得" onclick="twitchapi_getToken(this, [twitchapi_storeStreamStatus]);">
						<input type="password" value="secret-key" placeholder="Input the client_secret" onclick="this.select();">
					</form>
				</td>
			</tr>
			<tr>
				<td>
					<form id="twitchapi_getContents" class="require_authn">
						<input type="button" value="動画一覧取得" onclick="twitchapi_getContents(this)">
						<!--
						<input type="text" value="twitchdev" placeholder="Input the login_name">
						-->
					</form>
				</td>
			</tr>
			<tr>
				<td>
					<form id="twitchapi_autosetVideoMarker" class="require_authn require_streamingstatus">
						<input type="button" value="マーカー自動登録ON" onclick="twitchapi_autosetVideoMarker(this);this.remove();">
					</form>
				</td>
			</tr>
			<tr>
				<td>
					<form id="twitchapi_setVideoMarker" class="require_authn require_streamingstatus">
						<input type="button" value="マーカー登録" onclick="twitchapi_setVideoMarker(this);">
						<input type="text" value="" placeholder="ここ！ここだよ！ここ！">
					</form>
				</td>
			</tr>
		</table>
	</div>
	<div id="twitch_videos"></div>
</body>
